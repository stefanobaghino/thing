name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      # The binary's own runner over the self-hosted suite: proves
      # `--test` on every platform the way a user would run it.
      - name: Self-hosted suite via --test
        run: cargo run --quiet -- --test selftest
      # The same check the release runs on the archive it packages,
      # run here on every push against a directory laid out the way an
      # archive is. The release should not be the first place this
      # script is tried on macOS or Windows.
      - name: The archive layout, run
        shell: bash
        run: |
          cargo build --quiet
          mkdir -p smoke
          cp target/debug/ting smoke/ 2>/dev/null || cp target/debug/ting.exe smoke/
          cp -r lib smoke/lib
          tools/smoke.sh smoke "$(grep -m1 '^version' Cargo.toml | cut -d'\"' -f2)"

  # The whole integration surface again with the binary forced onto the
  # reference tree-walker (the VM is the default engine) — end-to-end
  # parity insurance beyond the in-process differential tests.
  test-eval:
    runs-on: ubuntu-latest
    env:
      TING_ENGINE: eval
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Tests (reference engine)
        run: cargo test
      - name: Self-hosted suite via --test (reference engine)
        run: cargo run --quiet -- --test selftest
