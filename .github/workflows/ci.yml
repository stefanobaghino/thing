name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      # The binary's own runner over the self-hosted suite: proves
      # `--test` on every platform the way a user would run it.
      - name: Self-hosted suite via --test
        run: cargo run --quiet -- --test selftest

  # The whole integration surface again with the binary forced onto the
  # reference tree-walker (the VM is the default engine) — end-to-end
  # parity insurance beyond the in-process differential tests.
  test-eval:
    runs-on: ubuntu-latest
    env:
      TING_ENGINE: eval
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Tests (reference engine)
        run: cargo test
      - name: Self-hosted suite via --test (reference engine)
        run: cargo run --quiet -- --test selftest
