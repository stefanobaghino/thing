# Deploys the browser playground (with a freshly built ting.wasm) to
# GitHub Pages on pushes that can affect it.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "playground/**"
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --release --lib --target wasm32-unknown-unknown
      - run: cp target/wasm32-unknown-unknown/release/ting.wasm playground/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground
      - id: deployment
        uses: actions/deploy-pages@v4
