# Deploys the browser playground (with a freshly built ting.wasm) to
# GitHub Pages on pushes that can affect it.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "playground/**"
      - "src/**"
      - "docs/**"
      - "tools/md2html.py"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --release --lib --target wasm32-unknown-unknown
      - run: cp target/wasm32-unknown-unknown/release/ting.wasm playground/
      - run: |
          mkdir -p _site
          cp -r playground/. _site/
          python3 tools/md2html.py docs/tutorial.md _site/tutorial.html
          python3 tools/md2html.py docs/reference.md _site/reference.html
          python3 tools/md2html.py docs/stdlib.md _site/stdlib.html
          python3 tools/md2html.py docs/retrospective.md _site/retrospective.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
