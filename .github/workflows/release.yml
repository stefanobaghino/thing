name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        run: >
          gh release create "$GITHUB_REF_NAME" --title "ting $GITHUB_REF_NAME"
          --notes "Prebuilt binaries below; or \`cargo build --release\` from source (zero dependencies). See docs/reference.md for the language and LOG.md for how this was built."
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds pin the oldest supported runner so the binaries
          # keep running on older distributions: the glibc a binary is
          # built against is the glibc it demands (v2.29.0, built on
          # 24.04, required 2.39 and failed on Debian 12).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          # Fully static builds: no C library dependency at all, for
          # hosts older than the glibc floor (or without glibc).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Check glibc floor (linux)
        if: runner.os == 'Linux'
        run: |
          need=$(objdump -T target/${{ matrix.target }}/release/ting | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol version: ${need:-none (static)}"
          if [ -n "$need" ] && [ "$(printf '%s\n' "$need" GLIBC_2.35 | sort -V | tail -1)" != GLIBC_2.35 ]; then
            echo "::error::binary requires $need; the floor is GLIBC_2.35"
            exit 1
          fi
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ting dist/
          cp -r lib dist/lib
          tar -czf "ting-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz" -C dist ting lib
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/ting.exe dist/
          Copy-Item -Recurse lib dist/lib
          Compress-Archive -Path dist/ting.exe, dist/lib -DestinationPath "ting-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
      # Nothing had ever started what this workflow packages. Six
      # archives a release since v2.30.0, and the only ones anybody
      # ran were the two aarch64 ones, downloaded by hand afterwards
      # — so four in six went out having never been executed at all.
      # The archive is now unpacked and put to work on its own runner
      # BEFORE it is offered to anyone, and a target that will not
      # start leaves its archive missing rather than broken.
      - name: Unpack what was packaged (unix)
        if: runner.os != 'Windows'
        run: mkdir -p unpacked && tar -xzf "ting-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz" -C unpacked
      - name: Unpack what was packaged (windows)
        if: runner.os == 'Windows'
        run: Expand-Archive -Path "ting-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip" -DestinationPath unpacked
      - name: Run it
        shell: bash
        run: tools/smoke.sh unpacked "${GITHUB_REF_NAME#v}"
      - name: Upload
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" ting-*
        env:
          GH_TOKEN: ${{ github.token }}
      # The step above ran the archive this runner built. This one runs
      # the archive the world will actually download, which is not the
      # same claim: everything between packaging and the release page
      # — the upload, the storage, the asset name — is untested until
      # something fetches it back and starts it.
      - name: Fetch what was uploaded
        shell: bash
        run: |
          rm -rf downloaded fetched
          mkdir -p downloaded fetched
          gh release download "$GITHUB_REF_NAME" --dir downloaded \
            --pattern "ting-$GITHUB_REF_NAME-${{ matrix.target }}.*"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Unpack the download (unix)
        if: runner.os != 'Windows'
        run: tar -xzf "downloaded/ting-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz" -C fetched
      # Each platform unpacks with its own tool, and the zip gets
      # PowerShell. `tar` under Git Bash is GNU tar, not the bsdtar in
      # System32, and GNU tar does not read zip: v2.125.0's release
      # went red here on "this does not look like a tar archive".
      - name: Unpack the download (windows)
        if: runner.os == 'Windows'
        run: Expand-Archive -Path "downloaded/ting-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip" -DestinationPath fetched
      - name: Run it again
        shell: bash
        run: tools/smoke.sh fetched "${GITHUB_REF_NAME#v}"

  # Reachable only when every target has built, run the archive it
  # packaged, uploaded it, fetched it back and run that too — so the
  # sentence this writes into the release notes is true by
  # construction rather than by assertion. If one target fails, the
  # notes keep the plain text `create` gave them and nobody is told a
  # check happened that did not.
  finish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish checksums and say what was verified
        shell: bash
        run: |
          rm -rf assets && mkdir -p assets
          gh release download "$GITHUB_REF_NAME" --dir assets --pattern 'ting-*'
          (cd assets && sha256sum ting-* > SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" assets/SHA256SUMS
          cat > notes.md <<'NOTES'
          Prebuilt binaries below; or `cargo build --release` from source (zero
          dependencies). See docs/reference.md for the language and LOG.md for how
          this was built.

          **Every archive here was run before you were offered it.** Each one was
          unpacked on a machine of its own platform and put to work — the binary
          started from the directory it was unpacked into, the self-hosted suite
          run against the stdlib compiled into it, and every example diffed
          against its recorded output — first as the file the build produced, then
          again as the file this page serves.

          `SHA256SUMS` lets you check that a download arrived intact. It is not a
          signature: it says nothing about who produced these files, only that the
          bytes you have are the bytes this page is serving.
          NOTES
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
