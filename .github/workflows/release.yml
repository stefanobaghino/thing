name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        run: >
          gh release create "$GITHUB_REF_NAME" --title "ting $GITHUB_REF_NAME"
          --notes "Prebuilt binaries below; or \`cargo build --release\` from source (zero dependencies). See docs/reference.md for the language and LOG.md for how this was built."
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds pin the oldest supported runner so the binaries
          # keep running on older distributions: the glibc a binary is
          # built against is the glibc it demands (v2.29.0, built on
          # 24.04, required 2.39 and failed on Debian 12).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Build
        run: cargo build --release
      - name: Check glibc floor (linux)
        if: runner.os == 'Linux'
        run: |
          need=$(objdump -T target/release/ting | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol version: $need"
          if [ "$(printf '%s\n' "$need" GLIBC_2.35 | sort -V | tail -1)" != GLIBC_2.35 ]; then
            echo "::error::binary requires $need; the floor is GLIBC_2.35"
            exit 1
          fi
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/ting dist/
          cp -r lib dist/lib
          tar -czf "ting-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz" -C dist ting lib
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/ting.exe dist/
          Copy-Item -Recurse lib dist/lib
          Compress-Archive -Path dist/ting.exe, dist/lib -DestinationPath "ting-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
      - name: Upload
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" ting-*
        env:
          GH_TOKEN: ${{ github.token }}
